name: Yomitoki Japanese check
on:
  workflow_dispatch:
  push:
    branches: [feat/stability]
    paths:
      - "yomitoki/trial-worker/tools/jp-check-request.txt"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - name: 測るページの枝
        id: ref
        run: echo "ref=$(tail -1 tools/yomitoki/trial-worker/tools/jp-check-request.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ブラウザの用意
        working-directory: tools/yomitoki/trial-worker
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: 測る
        working-directory: tools/yomitoki/trial-worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUNS: "3"
        run: |
          (cd $GITHUB_WORKSPACE/site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node tools/jp-check.mjs http://localhost:8765/yomitoki/
